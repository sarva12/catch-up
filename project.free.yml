name: CatchUpFree
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  CatchUpFree:
    type: application
    platform: iOS
    info:
      path: CatchUp/Info.plist
    sources:
      - path: CatchUp
        excludes:
          - Shared
          - CatchUp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CatchUpFree
        PRODUCT_NAME: CatchUp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIDELOAD"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

