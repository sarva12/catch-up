name: CatchUp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  CatchUp:
    type: application
    platform: iOS
    info:
      path: CatchUp/Info.plist
      properties:
        CFBundleDisplayName: Catch Up
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAlarmKitUsageDescription: Catch Up schedules alarms for the times you choose so you can start your daily news briefing.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - CatchUp
    dependencies:
      - target: CatchUpMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CatchUp
        PRODUCT_NAME: CatchUp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: CatchUp/CatchUp.entitlements
  CatchUpMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/CatchUpMonitor
      - CatchUp/Shared
    info:
      path: Extensions/CatchUpMonitor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CatchUp.Monitor
        CODE_SIGN_ENTITLEMENTS: Extensions/CatchUpMonitor/CatchUpMonitor.entitlements
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
  CatchUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CatchUpTests
    dependencies:
      - target: CatchUp

