name: Build and publish SideStore edition
# SideStore consumes the AltSource JSON format generated later in this workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Unique bundle ID, such as com.yourname.CatchUpFree
        required: true
        default: com.github.sarva12.CatchUpFree
      developer_name:
        description: Name shown in SideStore
        required: true
        default: sarva12
      version:
        description: Marketing version
        required: true
        default: 1.0.0
      build_number:
        description: Numeric build number
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: catch-up-sidestore-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-26
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icons
        run: |
          swift scripts/generate_app_icon.swift \
            CatchUp/Resources/Assets.xcassets/AppIcon.appiconset/CatchUp-AppIcon-1024.png \
            altstore/CatchUp-AppIcon-1024.png

      - name: Generate free-edition Xcode project
        run: xcodegen generate --spec project.free.yml

      - name: Build unsigned device app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.github.sarva12.CatchUpFree' }}
          VERSION: ${{ inputs.version || '1.0.0' }}
          BUILD_NUMBER: ${{ inputs.build_number || '3' }}
        run: |
          xcodebuild \
            -project CatchUpFree.xcodeproj \
            -scheme CatchUpFree \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build

      - name: Verify AlarmKit permission text
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          USAGE_DESCRIPTION="$(/usr/libexec/PlistBuddy -c 'Print :NSAlarmKitUsageDescription' "$APP_PATH/Info.plist")"
          test -n "$USAGE_DESCRIPTION"

      - name: Package IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/CatchUp.app
          cd package
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload CatchUp-SideStore.ipa

      - name: Generate SideStore-compatible AltSource
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.github.sarva12.CatchUpFree' }}
          DEVELOPER_NAME: ${{ inputs.developer_name || 'sarva12' }}
          VERSION: ${{ inputs.version || '1.0.0' }}
          BUILD_NUMBER: ${{ inputs.build_number || '3' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          node altstore/generate-source.mjs \
            --ipa package/CatchUp-SideStore.ipa \
            --owner "$OWNER" \
            --repo "$REPOSITORY" \
            --bundle-id "$BUNDLE_ID" \
            --developer "$DEVELOPER_NAME" \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --output package/source.json
          cp package/source.json package/sidestore-source.json
          mkdir -p package/site
          cp package/source.json package/site/source.json
          cp altstore/CatchUp-AppIcon-1024.png package/site/CatchUp-AppIcon-1024.png
          cat > package/site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Catch Up for SideStore</title>
          <style>body{max-width:40rem;margin:10vh auto;padding:2rem;font:18px system-ui;color:#111;background:#fff}a{color:#111}</style>
          <h1>Catch Up</h1>
          <p>A finite morning news habit for iPhone.</p>
          <p><a href="source.json">SideStore source</a></p>
          EOF

      - name: Publish SideStore IPA and source as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version || '1.0.0' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              package/CatchUp-SideStore.ipa \
              package/source.json \
              package/sidestore-source.json \
              package/site/CatchUp-AppIcon-1024.png \
              --clobber
            gh release edit "$TAG" \
              --title "Catch Up $TAG for SideStore" \
              --notes "Free SideStore edition. Add sidestore-source.json as an app source, then install Catch Up."
          else
            gh release create "$TAG" \
              package/CatchUp-SideStore.ipa \
              package/source.json \
              package/sidestore-source.json \
              package/site/CatchUp-AppIcon-1024.png \
              --title "Catch Up $TAG for SideStore" \
              --notes "Free SideStore edition. Add sidestore-source.json as an app source, then install Catch Up."
          fi

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: CatchUp-SideStore-${{ inputs.version || '1.0.0' }}
          path: |
            package/CatchUp-SideStore.ipa
            package/source.json
            package/sidestore-source.json

